# Open WebUI + Ollama (local LLM) + a FastAPI OpenAPI tool server for local
# Stable Diffusion image generation. CPU-only: everything runs on this machine,
# no special hardware required.
#
# Secrets come from .env (generated by ./scripts/setup.sh, never committed).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Unload the LLM from RAM shortly after use so Stable Diffusion
      # has room on machines with limited memory.
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama-data:/root/.ollama

  image-tool:
    build: ./tool-server
    restart: unless-stopped
    environment:
      - TOOL_API_KEY=${TOOL_API_KEY:?run ./scripts/setup.sh first}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8001}
      - MODEL_ID=${MODEL_ID:-stabilityai/sd-turbo}
      - DEFAULT_STEPS=${DEFAULT_STEPS:-4}
      - GUIDANCE_SCALE=${GUIDANCE_SCALE:-0.0}
      - IDLE_UNLOAD_SECONDS=${IDLE_UNLOAD_SECONDS:-120}
      - HF_HOME=/models
    ports:
      # Published on localhost only: the browser needs it to load generated images.
      - "8001:8000"
    volumes:
      - hf-cache:/models
      - generated-images:/data/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - ollama
      - image-tool
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?run ./scripts/setup.sh first}
      # Pre-registers the tool server (Admin Settings -> External Tools).
      # Open WebUI calls it server-side over the compose network, with a bearer key.
      # NOTE: this is a "persistent config" value: it is only read on the first
      # boot of a fresh volume. See README ("Rotating the key").
      - 'TOOL_SERVER_CONNECTIONS=[{"type":"openapi","url":"http://image-tool:8000","path":"openapi.json","auth_type":"bearer","key":"${TOOL_API_KEY}","config":{"enable":true},"info":{"id":"image-gen","name":"Local Image Generator","description":"Generate images with a local Stable Diffusion model."}}]'
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  ollama-data:
  open-webui-data:
  hf-cache:
  generated-images:
